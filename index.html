<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>牛牛牧场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Patrick+Hand&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="stat" id="dayStat">第 1 天</div>
      <div class="stat" id="phaseTag">☀️ 白天</div>
      <div class="stat" id="timer">01:30</div>
      <div class="stat" id="goldStat">💰 ¥0</div>
      <button class="iconbtn" id="speedBtn">▶▶</button>
      <button class="iconbtn" id="pauseBtn">⏸</button>
    </div>
    <div id="board">
      <div id="nightVignette"></div>
      <div id="pauseBadge">⏸ 已暂停</div>
      <div id="market"><div class="m-emoji">🏪</div><div>市场</div></div>
      <div id="toast"></div>
    </div>
    <div id="bottombar">
      <div class="navbtn" id="packBtn"><span class="ne">🎁</span>卡包</div>
      <div class="navbtn" id="taskBtn"><span class="ne">📜</span>任务</div>
      <div class="navbtn" id="codexBtn"><span class="ne">📖</span>图鉴</div>
      <div class="navbtn" id="recipeBtn"><span class="ne">⚗️</span>合成</div>
      <div class="navbtn" id="helpBtn"><span class="ne">❔</span>帮助</div>
      <div class="navbtn" id="setBtn"><span class="ne">⚙️</span>设置</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
