<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>牛牛农场</title>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="stat" id="dayStat">第 1 天</div>
      <div class="stat" id="timer">02:00</div>
      <button class="iconbtn" id="pauseBtn">⏸ 暂停</button>
      <div class="stat" id="cashStat">💰 ¥0</div>
      <div class="stat" id="bankStat">🏦 ¥0</div>
      <button class="iconbtn" id="helpBtn">❔ 帮助</button>
    </div>
    <div id="packRow"></div>
    <div id="board">
      <div id="market">🏪 市场（把牛拖到这里出售）</div>
      <div id="toast"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
