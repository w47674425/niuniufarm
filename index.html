<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>牛牛牧场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Patrick+Hand&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="stat" id="dayStat">第 1 天</div>
      <div class="stat" id="phaseTag">☀️</div>
      <div class="stat" id="timer">01:30</div>
      <div class="spacer"></div>
      <div class="stat" id="goldStat">💰 0</div>
      <button class="iconbtn" id="speedBtn" title="加速">▶▶</button>
      <button class="iconbtn" id="pauseBtn" title="暂停">⏸</button>
    </div>
    <div id="board">
      <div id="nightVignette"></div>
      <div id="pauseBadge">⏸ 已暂停</div>
      <div id="market"><div class="m-emoji"><img src="img/ui_market.png" alt="市场" /></div><div>市场</div></div>
      <div id="toast"></div>
    </div>
    <div id="bottombar">
      <div class="navbtn" id="travelBtn"><span class="ne"><img src="img/ui_passport.png" alt="" /></span>护照</div>
      <div class="navbtn" id="packBtn"><span class="ne"><img src="img/ui_pack.png" alt="" /></span>卡包</div>
      <div class="navbtn" id="taskBtn"><span class="ne"><img src="img/ui_task.png" alt="" /></span>任务</div>
      <div class="navbtn" id="codexBtn"><span class="ne"><img src="img/ui_codex.png" alt="" /></span>图鉴</div>
      <div class="navbtn" id="setBtn"><span class="ne"><img src="img/ui_set.png" alt="" /></span>设置</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
