<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>牛牛牧场</title>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div class="stat" id="dayStat">第 1 天</div>
      <div class="stat" id="phaseTag">☀️ 白天</div>
      <div class="stat" id="timer">01:30</div>
      <div class="stat" id="goldStat">💰 ¥0</div>
      <div class="stat" id="popStat">🧑 0/0</div>
      <div class="stat" id="foodStat">🍖 0</div>
      <button class="iconbtn" id="pauseBtn">⏸</button>
    </div>
    <div id="board">
      <div id="nightVignette"></div>
      <div id="market">🏪 市场（把卡拖到这里卖钱）</div>
      <div id="toast"></div>
    </div>
    <div id="bottombar">
      <div class="navbtn" id="packBtn"><span class="ne">🎁</span>卡包</div>
      <div class="navbtn" id="taskBtn"><span class="ne">📜</span>任务</div>
      <div class="navbtn" id="codexBtn"><span class="ne">📖</span>图鉴</div>
      <div class="navbtn" id="helpBtn"><span class="ne">❔</span>帮助</div>
      <div class="navbtn" id="setBtn"><span class="ne">⚙️</span>设置</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
