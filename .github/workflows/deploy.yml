name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 最少权限原则：构建读、Pages 写、OIDC 用
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署任务
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 防止 GitHub Pages 的 Jekyll 处理（本项目无下划线资源，但加上更稳妥）
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
